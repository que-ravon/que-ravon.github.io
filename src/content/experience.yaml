- id: cispa
  kind: work
  org: CISPA Helmholtz Center for Information Security
  title: Research Intern, Trusted Systems Group
  location: Saarbrücken, Germany
  period: May – Jul 2026
  url: https://cispa.de
  points:
    - Audited 131 open-source RISC-V cores by hand against their stated security claims, reading RTL, testbenches and commit history for each one.
    - Designed the study's taxonomy of 13 dimensions and 50 attributes, covering reproducibility, verification and CI/CD resilience.
    - Built the reproducible Python analysis pipeline, including the inter-rater reliability module, which produces 50+ figures and two composite hardware-security indices.
    - Found that 95% of the cores have no side-channel defenses and 77% have no secure boot. The findings are part of a paper the group is preparing.

